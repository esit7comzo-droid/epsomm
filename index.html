<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>내 공인 IP 확인</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #ip {
      font-size: 2em;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <h1>당신의 공인 IP 주소:</h1>
  <div id="ip">불러오는 중...</div>

  <script>
    async function getPublicIP() {
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        document.getElementById('ip').textContent = data.ip;
      } catch (error) {
        document.getElementById('ip').textContent = 'IP를 가져올 수 없습니다.';
        console.error(error);
      }
    }

    getPublicIP();
  </script>
</body>
</html>
